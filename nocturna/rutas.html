<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Rutas</title>
  <!-- Play CDN de Tailwind: solo para prototipar -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white antialiased min-h-screen flex items-center justify-center p-6">
  <article class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
    <img src="https://picsum.photos/seed/luces/640/320" alt="Ciclistas recorriendo el centro de Medellín de noche" class="w-full h-48 object-cover">
    <div class="p-6 space-y-4">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-block bg-emerald-500/15 text-emerald-300 text-xs font-semibold uppercase tracking-wide px-3 py-1 rounded-full">Fácil</span>
        <p class="text-xl font-bold text-amber-300">$55.000</p>
      </div>
      <h3 class="text-2xl font-bold text-white">Luces del Centro</h3>
      <dl class="space-y-2 text-sm border-t border-slate-800 pt-4">
        <div class="flex justify-between gap-4">
          <dt class="text-slate-400">Distancia</dt>
          <dd class="font-semibold text-slate-100">10 km</dd>
        </div>
        <div class="flex justify-between gap-4">
          <dt class="text-slate-400">Duración</dt>
          <dd class="font-semibold text-slate-100">2 h</dd>
        </div>
        <div class="flex justify-between gap-4">
          <dt class="text-slate-400">Punto de encuentro</dt>
          <dd class="font-semibold text-slate-100 text-right">Sede de Rueda Libre</dd>
        </div>
      </dl>
      <a href="#inscripcion" class="block w-full text-center bg-amber-400 text-slate-950 font-semibold px-6 py-3 rounded-full shadow-md hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900 transition">Inscríbete</a>
    </div>
  </article>
</body>
</html>
