<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Prototipo</title>
  <!-- Play CDN de Tailwind: solo para prototipar -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white antialiased">
  <main class="min-h-screen flex items-center justify-center px-4 py-12">
    <section class="w-full max-w-3xl bg-slate-900 text-white px-6 py-16 text-center rounded-3xl space-y-6">
      <p class="uppercase tracking-widest text-sm text-amber-300 font-semibold">Nuevo · Jueves a sábado</p>
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight">Rueda Nocturna</h1>
      <p class="text-lg text-slate-300 leading-relaxed max-w-xl mx-auto">Descubre Medellín en bici cuando se encienden las luces</p>
      <ul class="flex flex-wrap justify-center gap-6 pt-2 text-base font-semibold text-amber-200">
        <li class="bg-slate-800 px-4 py-2 rounded-full">3 rutas</li>
        <li class="bg-slate-800 px-4 py-2 rounded-full">Desde $55.000</li>
      </ul>
      <div class="pt-2">
        <a href="#inscripcion" class="inline-block bg-amber-400 text-slate-950 font-semibold px-8 py-3 rounded-full hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">Inscríbete</a>
      </div>
    </section>
  </main>
</body>
</html>
